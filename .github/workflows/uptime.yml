# Every 5 minutes: check the sites, update README.md (the status page) and the 7-day history,
# open an "outage" issue when a site goes down and close it when it is back.
# This repository is public, so the runs cost no Actions minutes.
name: uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save
        run: |
          git config user.name "uptime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/status.json
          git diff --cached --quiet && exit 0
          git commit -q -m "status $(date -u +%FT%TZ)"
          git push -q || { git pull -q --rebase && git push -q; }
